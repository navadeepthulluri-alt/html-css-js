```
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Segoe UI, Arial, sans-serif;
        background: #f5f7fb;
        color: #172033;
    }

    .wrap {
        width: min(1100px, 92%);
        margin: auto;
    }

    .nav {
        padding: 18px 0;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
    }

    .nav a,
    .btn {
        display: inline-block;
        background: #4f46e5;
        color: #fff;
        padding: 10px 15px;
        border-radius: 10px;
        text-decoration: none;
        border: 0;
        cursor: pointer;
    }

    .secondary {
        background: #e9eafc !important;
        color: #312e81 !important;
    }

    .hero {
        padding: 30px 0;
    }

    .card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 8px 25px #17203312;
        margin-bottom: 20px;
    }

    .muted {
        color: #667085;
    }

    audio,
    video {
        width: 100%;
    }

    footer {
        text-align: center;
        color: #667085;
        padding: 30px 0;
    }

    @media(max-width:600px) {
        .nav {
            align-items: flex-start;
        }
    }
</style>
```

</head>

<body>

```
<header class="wrap nav">
    <strong>Practical Lab</strong>

    <nav>
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">HTML Programs</a>
    </nav>
</header>

<main class="wrap hero">

    <h1>Create a webpage using audio and video elements.</h1>

    <div class="card">
        <h2>Audio</h2>

        <p class="muted">Play the audio file below:</p>

        <audio controls>
            <source src="audio.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <div class="card">
        <h2>Video</h2>

        <p class="muted">Play the video file below:</p>

        <video controls>
            <source src="video.mp4" type="video/mp4">
            Your browser does not support the video element.
        </video>
    </div>

</main>

<footer>
    HTML • CSS • JavaScript Practical Programs | T. Navadeep
</footer>
```

</body>
