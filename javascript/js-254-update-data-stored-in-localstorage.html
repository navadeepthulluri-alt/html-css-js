<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Update data stored in localStorage.</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{width:min(1100px,92%);margin:auto}.nav{padding:18px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.nav a,.btn{display:inline-block;background:#4f46e5;color:#fff;padding:10px 15px;border-radius:10px;text-decoration:none;border:0;cursor:pointer}.secondary{background:#e9eafc!important;color:#312e81!important}.hero{padding:30px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;box-shadow:0 8px 25px #17203312}.muted{color:#667085}input,select,textarea{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccd3df;border-radius:9px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #d7dce5;padding:9px}ol.list{display:grid;gap:8px}ol.list a{color:#4338ca;text-decoration:none}.result{padding:12px;margin-top:12px;background:#eef2ff;border-radius:10px;min-height:24px}footer{text-align:center;color:#667085;padding:30px 0}@media(max-width:600px){.nav{align-items:flex-start}}</style></head><body><header class="wrap nav"><strong>Practical Lab</strong><nav><a href="../index.html">Home</a> <a class="secondary" href="index.html">JavaScript Programs</a></nav></header><main class="wrap hero"><h1>Update data stored in localStorage.</h1><input id="v" placeholder="Value"><button class="btn" onclick="save()">Save</button><button class="btn secondary" onclick="load()">Load</button><div id="result" class="result"></div></main><footer>HTML • CSS • JavaScript Practical Programs | T. Navadeep</footer><script>function save(){localStorage.setItem("labValue",v.value);result.textContent="Saved"}function load(){result.textContent=localStorage.getIt
